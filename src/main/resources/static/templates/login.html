<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter — Login</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 4rem auto; padding: 0 1rem; text-align: center; }
    h1 { border-bottom: 2px solid #333; padding-bottom: 0.4rem; }
    form { display: grid; gap: 0.5rem; margin-top: 1.5rem; text-align: left; }
    label { font-weight: bold; }
    input { padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { padding: 0.6rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 0.5rem; }
    button:hover { background: #1d4ed8; }
    .error { color: #dc2626; font-size: 0.9rem; margin-top: 0.5rem; }
    .logout { color: #16a34a; font-size: 0.9rem; margin-top: 0.5rem; }
    .back-link { display: inline-block; margin-top: 1.5rem; color: #2563eb; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Shelter Login</h1>

    <div th:if="${param.error}" class="error">
      Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="logout">
      You have been logged out.
    </div>

    <form th:action="@{/login}" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required placeholder="e.g. admin">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required placeholder="e.g. admin123">

      <button type="submit">Log in</button>
    </form>

    <a th:href="@{/}" class="back-link">← Back to home</a>
  </main>
</body>
</html>
